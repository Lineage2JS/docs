services:

  database:
    image: postgres:17.7
    restart: unless-stopped
    environment:
      POSTGRES_USER: l2js-user
      POSTGRES_PASSWORD: l2js-passwd
      POSTGRES_DB: l2js-db
    volumes:
      - database:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d

  game-server:
    image: game-server:latest
    restart: unless-stopped
    environment:
      GS_HOST: game-server
      GS_PORT: '7777'
      DB_USER: l2js-user
      DB_PASSWORD: l2js-passwd
      DB_NAME: l2js-db
      DB_HOST: database
      DB_PORT: '5432'
    ports:
      - "7777:7777"
    depends_on:
      - database

  login-server:
    image: login-server:latest
    restart: unless-stopped
    environment:
      LS_HOST: login-server
      LS_PORT: '2106'
      DB_USER: l2js-user
      DB_PASSWORD: l2js-passwd
      DB_NAME: l2js-db
      DB_HOST: database
      DB_PORT: '5432'
    ports:
      - "2106:2106"
    depends_on:
      - database

  web-server:
      image: web-server:latest
      restart: unless-stopped
      environment:
        WS_PORT: '80'
        LS_HOST: login-server
        LS_PORT: '2106'
        GS_HOST: game-server
        GS_PORT: '2106'
        DB_USER: l2js-user
        DB_PASSWORD: l2js-passwd
        DB_NAME: l2js-db
        DB_HOST: database
        DB_PORT: '5432'
        STATIC_FILES_PATH: '/var/www/html/lineage2js-web-ui/'
      ports:
        - "8000:80"
      depends_on:
        - login-server
        - game-server

volumes:
  database:
